services:

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: hh-salary-api:latest
    container_name: hh-salary-api
    ports:
      - "8080:8080"
    volumes:
      - ./models:/app/models:ro
    environment:
      - MODEL_PATH=/app/models/final_model.joblib
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    image: hh-salary-streamlit:latest
    container_name: hh-salary-streamlit
    ports:
      - "8501:8501"
    volumes:
      - ./src:/app/src:ro
      - ./streamlit/streamlit_app.py:/app/streamlit_app.py:ro
    environment:
      - INFERENCE_URL=http://api:8080
      - HH_CLIENT_ID=${HH_CLIENT_ID:-}
      - HH_CLIENT_SECRET=${HH_CLIENT_SECRET:-}
      - HH_ACCESS_TOKEN=${HH_ACCESS_TOKEN:-}
      - HH_USER_AGENT=${HH_USER_AGENT}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
